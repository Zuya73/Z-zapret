name: Ошибка x2zapret
description: Проблема с приложением, автозапуском или проверкой стратегий
title: "[Ошибка] "
body:
  - type: markdown
    attributes:
      value: |
        Опишите проблему с графическим приложением x2zapret.
        Руководство: https://github.com/Zuya73/x2zapret/blob/main/docs/USER-GUIDE.md
  - type: input
    id: version
    attributes:
      label: Версия приложения и Windows
      placeholder: x2zapret 0.2.1, Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить ошибку
      description: Какие действия выполняли, что ожидали и что произошло?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Диагностика и результаты автоподбора
      description: Укажите выбранную стратегию и приложите сохранённый отчёт, если он есть.
  - type: textarea
    id: log
    attributes:
      label: Сообщение об ошибке или журнал
      description: Журнал можно сохранить на вкладке «Журнал».
      render: text
